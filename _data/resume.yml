experience:
  - title: Bosch Center for Artificial Intelligence
    role: Master Thesis Student
    date: Jul 2025 – Jan 2026
    location: Renningen, DE
    description: >-
      Proposed a Low-Rank and Diagonal (LRD) covariance model for probabilistic
      online map generation in autonomous driving. Integrated uncertainty into
      downstream trajectory prediction via novel encoding schemes and confidence
      score-based feature modulation, leading to SOTA results on the nuScenes dataset.

  - title: Collaborative Artificial Intelligence
    role: Wissenschaftliche Hilfskraft (Research Assistant)
    date: Oct 2025 – Jan 2026
    location: Stuttgart, DE
    description: >-
      Worked under Fabian Kögel (supervised by Dr. Andreas Bulling) on extending
      MTEX, an explainability framework, by implementing input-attribution methods
      for multimodal transformer models like ViLT. Integrated AttnLRP, integrated
      gradients, and input × gradients into the framework and ran perturbation experiments.

  - title: Korro AI
    role: AICV Intern
    date: Sep 2024 – Mar 2025
    location: Darmstadt, DE
    description: >-
      Extended an in-house human pose estimation framework to predict relative depth
      values for pose joints. Developed a pipeline to enrich human pose datasets with
      depth annotations by leveraging DepthAnythingV2, a monocular depth estimation model.

  - title: MORESOPHY GmbH
    role: Working Student
    date: Apr 2024 – Jun 2024
    location: München, DE
    description: >-
      Developed predictive ML models to forecast client contact frequency and timing
      using a rich dataset with 50+ attributes. Emphasized explainable predictions to
      reveal key features influencing outcomes, aiming for impactful business insights.

  - title: SimTech Group for Dynamical Systems
    role: Wissenschaftliche Hilfskraft (Research Assistant)
    date: May 2023 – Sep 2024
    location: Stuttgart, DE
    bullets:                                                     # (markdown ok)
      - "**Bayesflow:** Worked under Marvin Schmitt to support the development of the open-source package *Bayesflow*, which enables efficient Bayesian inference with deep learning."
      - "**ARTSM:** Worked under Christian Pfaendner on an open-source Python package for backmapping of coarse-grained molecular structures into atomistic resolution using machine learning."

  - title: Human Computer Interaction & Cognitive Systems Lab
    role: Wissenschaftliche Hilfskraft (Research Assistant)
    date: May 2023 – Nov 2023
    location: Stuttgart, DE
    description: >-
      Worked under Dr. Mihai Bâce on a deep learning pipeline for generating human eye
      images using image-to-image translation. Used models like GroundingDINO for object
      detection and Segment Anything (SAM) for semantic segmentation.

  - title: Indian Institute of Technology, Guwahati
    role: Research Assistant
    date: Oct 2020 – Jun 2022
    location: Guwahati, IN
    description: >-
      Built open-source implementations of hand pose estimation models, including the
      Attention-based 2D Hand Pose Estimation model by Santavas et al. and the
      Convolutional Pose Machines paper by Wei et al. Both used the TensorFlow framework.

